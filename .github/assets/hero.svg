<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="DropAgentX v3 — Unified Core">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#101828"/>
      <stop offset="100%" stop-color="#12263A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="115%" r="75%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="15" fill="none" stroke="#233349" stroke-width="1.5"/>

  <!-- top hairline -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accent)" opacity="0.9"/>

  <!-- mark: double-entry balance glyph -->
  <g transform="translate(84,150)" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="-46" y1="-52" x2="46" y2="52"/>
    <line x1="46" y1="-52" x2="-46" y2="52"/>
    <circle cx="0" cy="0" r="66"/>
  </g>

  <!-- wordmark -->
  <text x="205" y="128" fill="#E7EEF8" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="0.5">DropAgentX <tspan fill="#818CF8">v3</tspan></text>
  <text x="206" y="172" fill="#9FB1C9" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="400">The Unified Core — one engine for the whole empire</text>
  <text x="206" y="212" font-family="ui-monospace,'JetBrains Mono',Consolas,monospace" font-size="17" fill="#6EE7B7">wallet · escrow market · AI cycle · parliament</text>

  <!-- currency chip -->
  <g font-family="ui-monospace,'JetBrains Mono',Consolas,monospace" font-size="15">
    <rect x="206" y="236" width="150" height="30" rx="15" fill="#0F1B2D" stroke="#27394F"/>
    <text x="281" y="256" fill="#7DD3FC" text-anchor="middle">integer Đ money</text>
    <rect x="364" y="236" width="132" height="30" rx="15" fill="#0F1B2D" stroke="#27394F"/>
    <text x="430" y="256" fill="#C4B5FD" text-anchor="middle">OpenAPI 3.1</text>
    <rect x="504" y="236" width="128" height="30" rx="15" fill="#0F1B2D" stroke="#27394F"/>
    <text x="568" y="256" fill="#FBCFE8" text-anchor="middle">fa / en · RTL</text>
    <rect x="640" y="236" width="118" height="30" rx="15" fill="#0F1B2D" stroke="#27394F"/>
    <text x="699" y="256" fill="#6EE7B7" text-anchor="middle">187 tests</text>
  </g>
</svg>
